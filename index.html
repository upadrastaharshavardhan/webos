<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AetherOS — Modern Desktop Simulation</title>
  <meta name="description" content="A beautiful, fully interactive web-based operating system simulation. Works offline and on GitHub Pages." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aether: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            },
            glass: 'rgba(15, 23, 42, 0.75)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.35s ease-out',
            'boot': 'bootPulse 1.5s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            bootPulse: { '0%, 100%': { opacity: '0.4' }, '50%': { opacity: '1' } },
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden select-none font-sans">

  <!-- ========== BOOT / LOCK SCREEN ========== -->
  <div id="lock-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 transition-opacity duration-700">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920&q=80')] bg-cover bg-center opacity-30"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-slate-950/80"></div>
    
    <div class="relative z-10 flex flex-col items-center gap-8 animate-fade-in">
      <div class="w-28 h-28 rounded-full bg-gradient-to-br from-sky-400 to-indigo-600 flex items-center justify-center shadow-2xl shadow-sky-500/30 ring-4 ring-white/10">
        <span class="text-5xl">🌌</span>
      </div>
      
      <div class="text-center">
        <h1 class="text-4xl font-semibold tracking-tight text-white mb-1">AetherOS</h1>
        <p class="text-slate-400 text-sm">Modern Desktop Simulation</p>
      </div>
      
      <div class="mt-4 flex flex-col items-center gap-3">
        <div class="text-6xl font-light tracking-tight text-white" id="lock-time">12:00</div>
        <div class="text-slate-400 text-sm" id="lock-date">Friday, September 4</div>
      </div>
      
      <button id="unlock-btn" class="mt-8 group relative px-10 py-3.5 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 text-white font-medium transition-all duration-300 hover:scale-105 active:scale-95 shadow-lg">
        <span class="flex items-center gap-2">
          <i data-lucide="unlock" class="w-4 h-4"></i>
          Click to Unlock
        </span>
      </button>
      
      <p class="text-xs text-slate-500 mt-6">Press any key or click anywhere</p>
    </div>
  </div>

  <!-- ========== DESKTOP ========== -->
  <div id="desktop" class="fixed inset-0 hidden flex-col">
    <!-- Wallpaper -->
    <div id="wallpaper" class="absolute inset-0 bg-cover bg-center transition-all duration-700"
         style="background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920&q=80');">
      <div class="absolute inset-0 bg-slate-950/40"></div>
    </div>

    <!-- Top Panel -->
    <header id="top-panel" class="relative z-50 h-9 flex items-center justify-between px-3 bg-slate-950/80 backdrop-blur-xl border-b border-white/5 text-sm">
      <div class="flex items-center gap-3">
        <button id="activities-btn" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md hover:bg-white/10 transition-colors">
          <i data-lucide="layout-grid" class="w-4 h-4 text-sky-400"></i>
          <span class="font-medium">Activities</span>
        </button>
        <span class="text-slate-500">|</span>
        <span id="panel-app-name" class="text-slate-300">Desktop</span>
      </div>
      
      <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-2 text-slate-200">
        <span id="panel-clock" class="font-medium tabular-nums">12:00</span>
      </div>
      
      <div class="flex items-center gap-1">
        <button class="p-1.5 rounded-md hover:bg-white/10 transition-colors" title="Network">
          <i data-lucide="wifi" class="w-4 h-4"></i>
        </button>
        <button class="p-1.5 rounded-md hover:bg-white/10 transition-colors" title="Sound">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
        <button class="p-1.5 rounded-md hover:bg-white/10 transition-colors" title="Battery">
          <i data-lucide="battery-full" class="w-4 h-4"></i>
        </button>
        <button id="power-btn" class="p-1.5 rounded-md hover:bg-white/10 transition-colors ml-1" title="Power">
          <i data-lucide="power" class="w-4 h-4 text-rose-400"></i>
        </button>
      </div>
    </header>

    <!-- Desktop Icons Area -->
    <main id="desktop-area" class="relative flex-1 overflow-hidden p-4">
      <div id="desktop-icons" class="grid grid-cols-1 gap-1 content-start w-24">
        <!-- Icons injected by JS -->
      </div>
      
      <!-- Windows Container -->
      <div id="windows-container" class="absolute inset-0 pointer-events-none">
        <!-- Windows will be added here -->
      </div>
    </main>

    <!-- Dock -->
    <footer id="dock" class="relative z-50 flex justify-center pb-3 pt-1">
      <div class="flex items-end gap-1.5 px-3 py-2 rounded-2xl bg-slate-900/80 backdrop-blur-2xl border border-white/10 shadow-2xl shadow-black/50">
        <!-- Dock items injected by JS -->
      </div>
    </footer>
  </div>

  <!-- ========== APP LAUNCHER (Activities Overview) ========== -->
  <div id="app-launcher" class="fixed inset-0 z-[60] hidden flex-col items-center justify-center bg-slate-950/90 backdrop-blur-2xl animate-fade-in">
    <div class="w-full max-w-4xl px-6">
      <div class="mb-8 text-center">
        <h2 class="text-2xl font-semibold text-white mb-2">Applications</h2>
        <p class="text-slate-400 text-sm">Click an app to launch</p>
      </div>
      <div id="launcher-grid" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-4">
        <!-- Apps injected by JS -->
      </div>
      <button id="close-launcher" class="mt-10 mx-auto block px-6 py-2 rounded-full bg-white/10 hover:bg-white/20 text-sm transition-colors">
        Close
      </button>
    </div>
  </div>

  <!-- ========== CONTEXT MENU ========== -->
  <div id="context-menu" class="fixed z-[70] hidden min-w-[180px] py-1.5 rounded-xl bg-slate-900/95 backdrop-blur-xl border border-white/10 shadow-2xl text-sm">
    <!-- Items injected by JS -->
  </div>

  <!-- ========== TOAST NOTIFICATIONS ========== -->
  <div id="toast-container" class="fixed top-12 right-4 z-[80] flex flex-col gap-2 pointer-events-none"></div>

  <script src="js/apps.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
